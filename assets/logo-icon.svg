  <path d="M32 12L17 19.5V30.5C17 40.8 23.5 49 32 52.2C40.5 49 47 40.8 47 30.5V19.5L32 12Z" 
        stroke="url(#glowGrad)" stroke-width="1.5" stroke-dasharray="3 2" fill="none" opacity="0.6"/>

  <!-- Central Core / AI Guard Node -->
  <circle cx="32" cy="27" r="5" fill="#6366F1"/>
  <circle cx="32" cy="27" r="2" fill="#FFFFFF"/>

  <!-- Neural Connection Pathways -->
  <path d="M32 32V42M26 38L32 42L38 38M23 25L17 23M41 25L47 23" 
