[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-management-system"
version = "0.1.0"
description = "Enterprise AI Agent Observability & Management System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "langfuse>=2.50.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.4",
]

[project.scripts]
agent-hub = "run:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
