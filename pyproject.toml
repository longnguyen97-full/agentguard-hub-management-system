[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-management-system"
version = "0.1.0"
description = "Enterprise AI Agent Control Plane & Observability System with Langfuse, Guardrails, and Human-in-the-Loop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Long Nguyen", email = "longnguyen97.full@gmail.com" }
]
keywords = [
    "ai-agent",
    "agentops",
    "llm-observability",
    "langfuse",
    "guardrails",
    "human-in-the-loop",
    "kill-switch",
    "fastapi"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "langfuse>=2.50.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.4",
    "ftfy>=6.3.1",
]

[project.urls]
Homepage = "https://github.com/longnguyen97-full/agent-management-system"
Repository = "https://github.com/longnguyen97-full/agent-management-system"
Issues = "https://github.com/longnguyen97-full/agent-management-system/issues"

[project.scripts]
agent-hub = "run:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
